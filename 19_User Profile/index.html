<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
    >

    <title>Eventra - Profile</title>


    <!-- OUTFIT -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >


    <!-- TAILWIND -->

    <script src="https://cdn.tailwindcss.com"></script>

    <script>

        tailwind.config = {

            theme: {

                extend: {

                    fontFamily: {

                        outfit: [
                            "Outfit",
                            "sans-serif"
                        ]

                    }

                }

            }

        };

    </script>


    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {

            margin: 0;

            padding: 0;

            width: 100%;

            min-height: 100%;

        }


        body {

            background: #F7F8FC;

            color: #17233B;

            font-family:
                "Outfit",
                sans-serif;

            font-style: normal;

            -webkit-font-smoothing: antialiased;

            overflow-x: hidden;

        }


        button {

            font-family:
                "Outfit",
                sans-serif;

            font-style: normal;

            -webkit-tap-highlight-color: transparent;

        }


        /* =================================================
           PAGE
        ================================================= */

        .profile-shell {

            width: 100%;

            min-height: 100vh;

            background: #F7F8FC;

        }


        .profile-main {

            width: 100%;

            padding:
                18px
                16px
                88px;

        }


        /* =================================================
           PROFILE CARD
        ================================================= */

        .profile-card {

            width: 100%;

            background:
                linear-gradient(
                    135deg,
                    #FFFFFF 0%,
                    #FFFFFF 70%,
                    #F2EAFE 100%
                );

            border-radius: 17px;

            padding:
                24px
                18px
                18px;

            box-shadow:
                0 5px 18px
                rgba(37, 43, 65, 0.07);

        }


        .profile-avatar {

            width: 92px;

            height: 92px;

            border-radius: 50%;

            background:
                linear-gradient(
                    145deg,
                    #6B20FF,
                    #4E00D9
                );

            color: #FFFFFF;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 29px;

            font-weight: 500;

            box-shadow:
                0 8px 20px
                rgba(91, 0, 232, 0.22);

        }


        .camera-button {

            position: absolute;

            width: 34px;

            height: 34px;

            right: -3px;

            bottom: 0;

            border-radius: 50%;

            background: #FFFFFF;

            color: #5B00E8;

            display: flex;

            align-items: center;

            justify-content: center;

            box-shadow:
                0 3px 9px
                rgba(0, 0, 0, 0.12);

        }


        .camera-button svg {

            width: 17px;

            height: 17px;

        }


        .profile-name {

            margin-top: 10px;

            font-size: 23px;

            line-height: 1.1;

            font-weight: 600;

            color: #17233B;

        }


        .verified-badge {

            display: inline-flex;

            vertical-align: middle;

            margin-left: 2px;

        }


        .verified-badge svg {

            width: 19px;

            height: 19px;

        }


        .profile-email {

            margin-top: 4px;

            font-size: 14px;

            line-height: 1.2;

            color: #535666;

        }


        .profile-location {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            gap: 5px;

            margin-top: 10px;

            padding:
                6px 11px;

            border-radius: 999px;

            background: #EEF2FF;

            color: #4E5060;

            font-size: 12px;

            line-height: 1;

            font-weight: 500;

        }


        .profile-location svg {

            width: 15px;

            height: 15px;

        }


        /* =================================================
           STATS
        ================================================= */

        .profile-stats {

            width: 100%;

            min-height: 78px;

            margin-top: 18px;

            border-radius: 15px;

            background:
                linear-gradient(
                    100deg,
                    #FFF7ED,
                    #F0F5FF
                );

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            align-items: center;

        }


        .profile-stat {

            text-align: center;

        }


        .profile-stat-number {

            font-size: 24px;

            line-height: 1;

            font-weight: 600;

            color: #5B00E8;

        }


        .profile-stat:last-child
        .profile-stat-number {

            color: #996000;

        }


        .profile-stat-label {

            margin-top: 6px;

            font-size: 11px;

            line-height: 1;

            font-weight: 500;

            letter-spacing: 0.2px;

            color: #555666;

        }


        /* =================================================
           HOST BANNER
        ================================================= */

        .host-banner {

            width: 100%;

            min-height: 96px;

            margin-top: 18px;

            padding:
                13px
                12px;

            border: 0;

            border-radius: 15px;

            background:
                linear-gradient(
                    105deg,
                    #5B00E8,
                    #7637FF
                );

            color: #FFFFFF;

            display: grid;

            grid-template-columns:
                48px
                minmax(0, 1fr)
                112px;

            align-items: center;

            column-gap: 10px;

            text-align: left;

            box-shadow:
                0 7px 18px
                rgba(91, 0, 232, 0.16);

        }


        .host-icon {

            width: 48px;

            height: 48px;

            border-radius: 13px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.17
                );

            display: flex;

            align-items: center;

            justify-content: center;

        }


        .host-icon svg {

            width: 25px;

            height: 25px;

        }


        .host-content {

            min-width: 0;

        }


        .host-title {

            font-size: 17px;

            line-height: 1.08;

            font-weight: 600;

            white-space: normal;

        }


        .host-description {

            margin-top: 4px;

            font-size: 12px;

            line-height: 1.2;

            font-weight: 400;

        }


        .switch-mode {

            width: 112px;

            height: 42px;

            border-radius: 999px;

            background: #FFFFFF;

            color: #5B00E8;

            display: flex;

            align-items: center;

            justify-content: center;

            text-align: center;

            font-size: 13px;

            line-height: 1;

            font-weight: 600;

            white-space: nowrap;

        }


        /* =================================================
           SECTIONS
        ================================================= */

        .profile-section {

            margin-top: 17px;

        }


        .section-title {

            margin:
                0 0 10px 5px;

            font-size: 13px;

            line-height: 1;

            font-weight: 500;

            letter-spacing: 0.4px;

            color: #4D5060;

            text-transform: uppercase;

        }


        .settings-card {

            width: 100%;

            background: #FFFFFF;

            border-radius: 15px;

            overflow: hidden;

            box-shadow:
                0 3px 12px
                rgba(39, 44, 62, 0.035);

        }


        .setting-row {

            width: 100%;

            min-height: 72px;

            padding:
                10px
                14px;

            display: flex;

            align-items: center;

            gap: 11px;

            text-align: left;

            border: 0;

            background: transparent;

        }


        .setting-icon {

            width: 44px;

            height: 44px;

            flex: 0 0 44px;

            border-radius: 50%;

            background: #EEF0FF;

            color: #5B00E8;

            display: flex;

            align-items: center;

            justify-content: center;

        }


        .setting-icon svg {

            width: 21px;

            height: 21px;

        }


        .setting-content {

            flex: 1;

            min-width: 0;

        }


        .setting-title {

            font-size: 15px;

            line-height: 1.15;

            font-weight: 500;

            color: #17233B;

            white-space: nowrap;

        }


        .setting-subtitle {

            margin-top: 3px;

            font-size: 12px;

            line-height: 1.2;

            color: #555666;

            white-space: nowrap;

        }


        .setting-right {

            display: flex;

            align-items: center;

            gap: 4px;

            flex-shrink: 0;

        }


        .setting-value {

            padding:
                4px 9px;

            border-radius: 999px;

            background: #E9EFFF;

            color: #5B00E8;

            font-size: 11px;

            line-height: 1;

            font-weight: 500;

            white-space: nowrap;

        }


        .setting-value.orange {

            background: #FFE1BA;

            color: #674314;

        }


        .setting-status {

            font-size: 11px;

            font-weight: 500;

            white-space: nowrap;

        }


        .chevron {

            width: 17px;

            height: 17px;

            color: #4E5261;

        }


        /* =================================================
           LOGOUT
        ================================================= */

        .logout-button {

            width: 100%;

            height: 58px;

            margin-top: 28px;

            border: 0;

            border-radius: 14px;

            background: #FFE8E7;

            color: #D32925;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 7px;

            font-size: 16px;

            font-weight: 500;

        }


        /* =================================================
           FOOTER
        ================================================= */

        .profile-footer {

            padding:
                18px
                0
                15px;

            text-align: center;

        }


        .footer-version {

            font-size: 12px;

            color: #555666;

        }


        .footer-credit {

            margin-top: 5px;

            font-size: 12px;

            color: #7A7C89;

        }


        /* =================================================
           BOTTOM NAV
        ================================================= */

        .bottom-navigation {

            position: fixed;

            left: 0;

            right: 0;

            bottom: 0;

            z-index: 50;

            height: 68px;

            background: #FFFFFF;

            border-top: 1px solid #EEF0F5;

        }


        .bottom-navigation-inner {

            width: 100%;

            height: 100%;

            display: grid;

            grid-template-columns:
                repeat(5, 1fr);

            align-items: center;

        }


        .bottom-nav-item {

            height: 100%;

            border: 0;

            background: transparent;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            gap: 3px;

            color: #9AA9BF;

        }


        .bottom-nav-item svg {

            width: 21px;

            height: 21px;

        }


        .bottom-nav-item span {

            font-size: 10px;

            line-height: 1;

        }


        .bottom-nav-item.active {

            color: #5B00E8;

        }


        .bottom-nav-item.active span {

            font-weight: 600;

        }


        /* =================================================
           TOAST
        ================================================= */

        #toast {

            transition:
                opacity 0.25s ease,
                transform 0.25s ease;

        }


        /* =================================================
           DESKTOP
        ================================================= */

        @media (min-width: 768px) {

            .profile-shell {

                max-width: 1180px;

                margin: 0 auto;

            }


            .profile-main {

                max-width: 700px;

                margin: 0 auto;

                padding:
                    40px
                    20px
                    100px;

            }


            .profile-card {

                padding:
                    30px
                    24px
                    22px;

            }


            .profile-avatar {

                width: 110px;

                height: 110px;

                font-size: 32px;

            }


            .profile-name {

                font-size: 27px;

            }


            .profile-email {

                font-size: 16px;

            }


            .profile-location {

                font-size: 14px;

            }


            .profile-stats {

                min-height: 90px;

            }


            .profile-stat-number {

                font-size: 28px;

            }


            .profile-stat-label {

                font-size: 13px;

            }


            .host-banner {

                min-height: 108px;

                grid-template-columns:
                    58px
                    minmax(0, 1fr)
                    145px;

                padding:
                    16px 18px;

            }


            .host-icon {

                width: 58px;

                height: 58px;

            }


            .host-title {

                font-size: 20px;

            }


            .host-description {

                font-size: 15px;

            }


            .switch-mode {

                width: 145px;

                height: 48px;

                font-size: 15px;

            }


            .section-title {

                font-size: 15px;

            }


            .setting-row {

                min-height: 88px;

                padding:
                    13px 20px;

            }


            .setting-icon {

                width: 52px;

                height: 52px;

                flex-basis: 52px;

            }


            .setting-title {

                font-size: 18px;

            }


            .setting-subtitle {

                font-size: 14px;

            }


            .setting-value {

                font-size: 13px;

            }


            .logout-button {

                height: 68px;

                font-size: 18px;

            }


            .bottom-navigation {

                height: 76px;

            }


            .bottom-nav-item svg {

                width: 23px;

                height: 23px;

            }


            .bottom-nav-item span {

                font-size: 11px;

            }

        }


        /* =================================================
           VERY SMALL PHONES
        ================================================= */

        @media (max-width: 350px) {

            .profile-main {

                padding-left: 12px;

                padding-right: 12px;

            }


            .profile-card {

                padding:
                    20px
                    14px
                    15px;

            }


            .profile-avatar {

                width: 84px;

                height: 84px;

                font-size: 27px;

            }


            .profile-name {

                font-size: 21px;

            }


            .profile-email {

                font-size: 13px;

            }


            .profile-location {

                font-size: 11px;

            }


            .profile-stats {

                min-height: 72px;

            }


            .profile-stat-number {

                font-size: 22px;

            }


            .profile-stat-label {

                font-size: 10px;

            }


            .host-banner {

                grid-template-columns:
                    42px
                    minmax(0, 1fr)
                    100px;

                column-gap: 7px;

                padding:
                    11px 9px;

            }


            .host-icon {

                width: 42px;

                height: 42px;

            }


            .host-title {

                font-size: 15px;

            }


            .host-description {

                font-size: 11px;

            }


            .switch-mode {

                width: 100px;

                height: 38px;

                font-size: 12px;

            }


            .setting-row {

                min-height: 68px;

                padding:
                    9px 11px;

                gap: 9px;

            }


            .setting-icon {

                width: 40px;

                height: 40px;

                flex-basis: 40px;

            }


            .setting-icon svg {

                width: 19px;

                height: 19px;

            }


            .setting-title {

                font-size: 14px;

            }


            .setting-subtitle {

                font-size: 11px;

            }

        }

    </style>

<style>html,body,*{font-style:normal!important;}</style>
</head>


<body>


<div class="profile-shell">


    <main class="profile-main">


        <!-- =================================================
             PROFILE CARD
        ================================================== -->

        <section class="profile-card">

            <div
                class="flex flex-col items-center text-center"
            >

                <div class="relative">

                    <div class="profile-avatar">
                        JD
                    </div>


                    <button
                        id="changePhotoButton"
                        type="button"
                        class="camera-button"
                        aria-label="Change profile photo"
                    >

                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                        >

                            <path
                                d="M5 7h3l1.5-2h5L16 7h3a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2Z"
                                stroke="currentColor"
                                stroke-width="1.8"
                                stroke-linejoin="round"
                            />

                            <circle
                                cx="12"
                                cy="13"
                                r="3.2"
                                stroke="currentColor"
                                stroke-width="1.8"
                            />

                        </svg>

                    </button>

                </div>


                <h1 class="profile-name">

                    John Doe

                    <span class="verified-badge">

                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                        >

                            <path
                                d="M12 2.8 14 4l2.4-.1 1.2 2.1 2.1 1.2-.1 2.4 1.2 2-1.2 2 .1 2.4-2.1 1.2-1.2 2.1-2.4-.1-2 1.2-2-1.2-2.4.1-1.2-2.1-2.1-1.2.1-2.4-1.2-2 1.2-2-.1-2.4 2.1-1.2 1.2-2.1L10 4l2-1.2Z"
                                fill="#5B00E8"
                            />

                            <path
                                d="m8.5 12 2.2 2.2 4.8-4.8"
                                stroke="white"
                                stroke-width="1.8"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            />

                        </svg>

                    </span>

                </h1>


                <p class="profile-email">
                    john@example.com
                </p>


                <div class="profile-location">

                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                    >

                        <path
                            d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z"
                            stroke="currentColor"
                            stroke-width="1.8"
                        />

                        <circle
                            cx="12"
                            cy="10"
                            r="2.5"
                            stroke="currentColor"
                            stroke-width="1.8"
                        />

                    </svg>

                    +234 801 234 5678 • Lagos, NG

                </div>

            </div>


            <!-- STATS -->

            <div class="profile-stats">

                <div class="profile-stat">

                    <div class="profile-stat-number">
                        14
                    </div>

                    <div class="profile-stat-label">
                        ATTENDED
                    </div>

                </div>


                <div class="profile-stat">

                    <div class="profile-stat-number">
                        3
                    </div>

                    <div class="profile-stat-label">
                        LIVE PASSES
                    </div>

                </div>


                <div class="profile-stat">

                    <div class="profile-stat-number">
                        2,450
                    </div>

                    <div class="profile-stat-label">
                        CLUB PTS
                    </div>

                </div>

            </div>

        </section>


        <!-- =================================================
             HOST BANNER
        ================================================== -->

        <button
            id="switchModeButton"
            type="button"
            class="host-banner"
        >

            <div class="host-icon">

                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                >

                    <path
                        d="M4 10v4h3l5 4V6l-5 4H4Z"
                        stroke="white"
                        stroke-width="1.8"
                        stroke-linejoin="round"
                    />

                    <path
                        d="M16 9c1 .8 1.5 1.8 1.5 3S17 14.2 16 15"
                        stroke="white"
                        stroke-width="1.8"
                        stroke-linecap="round"
                    />

                    <path
                        d="M18.5 6.5c1.8 1.5 2.8 3.3 2.8 5.5s-1 4-2.8 5.5"
                        stroke="white"
                        stroke-width="1.8"
                        stroke-linecap="round"
                    />

                </svg>

            </div>


            <div class="host-content">

                <div class="host-title">
                    Host Your Own Event
                </div>

                <div class="host-description">
                    Publish tickets &amp; track real-time sales
                </div>

            </div>


            <span class="switch-mode">
                Switch Mode
            </span>

        </button>


        <!-- =================================================
             ACCOUNT & PREFERENCES
        ================================================== -->

        <section class="profile-section">

            <h2 class="section-title">
                Account &amp; Preferences
            </h2>


            <div class="settings-card">


                <!-- PERSONAL -->

                <button
                    type="button"
                    data-action="personal"
                    class="setting-row"
                >

                    <div class="setting-icon">

                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                        >

                            <circle
                                cx="12"
                                cy="8"
                                r="3"
                                stroke="currentColor"
                                stroke-width="1.8"
                            />

                            <path
                                d="M5 20c.8-3.4 3.2-5 7-5s6.2 1.6 7 5"
                                stroke="currentColor"
                                stroke-width="1.8"
                                stroke-linecap="round"
                            />

                        </svg>

                    </div>


                    <div class="setting-content">

                        <div class="setting-title">
                            Personal Information
                        </div>

                    </div>


                    <svg
                        class="chevron"
                        viewBox="0 0 24 24"
                        fill="none"
                    >

                        <path
                            d="m9 5 7 7-7 7"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        />

                    </svg>

                </button>


                <!-- PAYMENT HISTORY -->

                <button
                    type="button"
                    data-action="payment-history"
                    class="setting-row"
                >

                    <div class="setting-icon">

                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                        >

                            <rect
                                x="5"
                                y="3"
                                width="14"
                                height="18"
                                rx="2"
                                stroke="currentColor"
                                stroke-width="1.8"
                            />

                            <path
                                d="M8 7h8M8 11h8M8 15h5"
                                stroke="currentColor"
                                stroke-width="1.7"
                                stroke-linecap="round"
                            />

                        </svg>

                    </div>


                    <div class="setting-content">

                        <div class="setting-title">
                            Payment History &amp; Orders
                        </div>

                        <div class="setting-subtitle">
                            8 completed orders in 2026
                        </div>

                    </div>


                    <div class="setting-right">

                        <span class="setting-value">
                            ₦185,000
                        </span>

                        <svg
                            class="chevron"
                            viewBox="0 0 24 24"
                            fill="none"
                        >

                            <path
                                d="m9 5 7 7-7 7"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            />

                        </svg>

                    </div>

                </button>


                <!-- PAYMENT METHODS -->

                <button
                    type="button"
                    data-action="payment-methods"
                    class="setting-row"
                >

                    <div class="setting-icon">

                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                        >

                            <rect
                                x="3"
                                y="5"
                                width="18"
                                height="14"
                                rx="2"
                                stroke="currentColor"
                                stroke-width="1.8"
                            />

                            <path
                                d="M3 9h18"
                                stroke="currentColor"
                                stroke-width="1.8"
                            />

                        </svg>

                    </div>


                    <div class="setting-content">

                        <div class="setting-title">
                            Linked Payment Methods
                        </div>

                        <div class="setting-subtitle">
                            Paystack • Mastercard •••• 4242
                        </div>

                    </div>


                    <svg
                        class="chevron"
                        viewBox="0 0 24 24"
                        fill="none"

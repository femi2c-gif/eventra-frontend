<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Eventra - Personal Information</title><link rel="stylesheet" href="../style.css"></head><body data-page="personal"><div class="page"><div class="shell"><div class="topbar"><button class="back" id="backButton" aria-label="Back"><svg viewBox="0 0 24 24" fill="none"><path d="M19 12H5M11 18l-6-6 6-6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div><h1 class="title">Personal Information</h1><p class="subtitle">Update your personal details and keep your Eventra profile current.</p><form id="profileForm" class="form-card"><div class="field"><label>First name</label><input name="first_name" required></div><div class="field"><label>Last name</label><input name="last_name" required></div><div class="field"><label>Email address <span class="verified">✓ Verified</span></label><input name="email" type="email" disabled></div><div class="field"><label>Phone number</label><input name="phone" type="tel"></div><div class="field"><label>Bio</label><textarea name="bio"></textarea></div><button class="primary full" type="submit">Save Changes</button><p id="formStatus" class="small" style="text-align:center;margin:12px 0 0"></p></form></div></div><div id="toast" class="toast"></div><script src="../script.js"></script></body></html>

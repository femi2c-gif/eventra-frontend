<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Eventra - Sign In</title>

  <!-- =====================================================
       TAILWIND CSS
  ====================================================== -->

  <script src="https://cdn.tailwindcss.com"></script>

  <script>

    tailwind.config = {

      theme: {

        extend: {

          fontFamily: {

            sans: [
              "Arial",
              "Helvetica",
              "sans-serif"
            ]

          },

          colors: {

            eventra: "#6230F5"

          },

          boxShadow: {

            button:
              "0 10px 24px rgba(98, 48, 245, 0.25)",

            input:
              "0 4px 14px rgba(15, 23, 42, 0.05)"

          }

        }

      }

    };

  </script>


  <!-- =====================================================
       CUSTOM CSS
  ====================================================== -->

  <style>

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: #F8F9FE;
    }

    body {

      margin: 0;

      min-width: 320px;

      min-height: 100vh;

      background:
        radial-gradient(
          circle at 92% 0%,
          rgba(226, 214, 255, 0.75),
          transparent 32%
        ),
        #F8F9FE;

      color: #172033;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      font-style: normal !important;

      overflow-x: hidden;

    }

    *,
    *::before,
    *::after {

      font-style: normal !important;

    }

    button,
    input,
    a {

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      font-style: normal !important;

    }

    button {

      cursor: pointer;

      -webkit-tap-highlight-color:
        transparent;

    }

    input:focus {

      outline: none;

    }

    .safe-bottom {

      padding-bottom:
        env(safe-area-inset-bottom);

    }

    @media (min-width: 768px) {

      body {

        display: flex;

        justify-content: center;

      }

    }

  </style>

</head>


<body>


  <!-- =====================================================
       MAIN APP
  ====================================================== -->

  <main
    class="
      relative
      min-h-[100svh]
      w-full
      max-w-[480px]
      overflow-hidden

      md:max-w-[680px]

      lg:max-w-[760px]
    "
  >


    <!-- ===================================================
         SOFT BACKGROUND
    ==================================================== -->

    <div
      class="
        pointer-events-none
        absolute
        right-[-100px]
        top-[-100px]
        h-[330px]
        w-[330px]
        rounded-full
        bg-[#E9DEFF]
        opacity-70
        blur-3xl
      "
    ></div>


    <!-- ===================================================
         CONTENT
    ==================================================== -->

    <section
      class="
        relative
        z-10
        flex
        min-h-[100svh]
        flex-col
        px-[18px]
        pt-[67px]
        pb-5

        sm:px-7
        sm:pt-[75px]

        md:mx-auto
        md:max-w-[600px]
        md:px-10

        lg:max-w-[620px]
      "
    >


      <!-- =================================================
           HEADING
      ================================================== -->

      <div>

        <h1
          class="
            text-[23px]
            font-bold
            leading-[1.15]
            tracking-[-0.5px]
            text-[#172033]

            sm:text-[27px]

            md:text-[29px]
          "
        >

          Welcome Back 👋

        </h1>


        <p
          class="
            mt-2
            max-w-[370px]
            text-[13px]
            font-normal
            leading-[1.55]
            text-[#69738A]

            sm:text-[14px]

            md:text-[15px]
          "
        >

          Sign in to access your tickets, saved events,
          and personalized recommendations.

        </p>

      </div>



      <!-- =================================================
           LOGIN FORM
      ================================================== -->

      <form
        id="loginForm"
        class="
          mt-[70px]
          flex
          flex-col

          sm:mt-[72px]

          md:mt-[78px]
        "
      >


        <!-- ===============================================
             EMAIL
        ================================================ -->

        <div>

          <label
            for="email"
            class="
              block
              text-[11px]
              font-bold
              uppercase
              tracking-[0.2px]
              text-[#3D465A]

              sm:text-[12px]
            "
          >

            Email Address

          </label>


          <div
            class="
              relative
              mt-1.5
            "
          >

            <!-- EMAIL ICON -->

            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="
                pointer-events-none
                absolute
                left-3
                top-1/2
                h-5
                w-5
                -translate-y-1/2
                text-[#8FA0B8]
              "
            >

              <rect
                x="3"
                y="5"
                width="18"
                height="14"
                rx="2"
              ></rect>

              <path
                d="m3 7 9 6 9-6"
              ></path>

            </svg>


            <input
              id="email"
              name="email"
              type="email"
              autocomplete="email"
              placeholder="john@example.com"
              value="john@example.com"
              required
              class="
                h-[47px]
                w-full
                rounded-[13px]
                border
                border-[#E1E5ED]
                bg-white
                pl-[40px]
                pr-4
                text-[14px]
                font-normal
                text-[#172033]
                shadow-input
                transition

                placeholder:text-[#69738A]

                focus:border-[#6230F5]
                focus:ring-2
                focus:ring-[#6230F5]/10

                sm:h-[49px]
                sm:text-[14px]

                md:h-[52px]
                md:text-[15px]
              "
            >

          </div>

          <p
            id="emailError"
            class="
              mt-1
              hidden
              text-[11px]
              font-medium
              text-red-500
            "
          ></p>

        </div>



        <!-- ===============================================
             PASSWORD
        ================================================ -->

        <div
          class="mt-5"
        >

          <label
            for="password"
            class="
              block
              text-[11px]
              font-bold
              uppercase
              tracking-[0.2px]
              text-[#3D465A]

              sm:text-[12px]
            "
          >

            Password

          </label>


          <div
            class="
              relative
              mt-1.5
            "
          >

            <!-- PASSWORD ICON -->

            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="
                pointer-events-none
                absolute
                left-3
                top-1/2
                h-5
                w-5
                -translate-y-1/2
                text-[#8FA0B8]
              "
            >

              <rect
                x="4"
                y="10"
                width="16"
                height="10"
                rx="2"
              ></rect>

              <path
                d="M8 10V7a4 4 0 0 1 8 0v3"
              ></path>

              <circle
                cx="8"
                cy="15"
                r="1"
              ></circle>

              <path
                d="M8 16v1"
              ></path>

            </svg>


            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              placeholder="Enter your password"
              value="Test@1234"
              required
              class="
                h-[47px]
                w-full
                rounded-[13px]
                border
                border-[#E1E5ED]
                bg-white
                pl-[40px]
                pr-[48px]
                text-[14px]
                font-normal
                tracking-[0.2px]
                text-[#172033]
                shadow-input
                transition

                placeholder:text-[#69738A]

                focus:border-[#6230F5]
                focus:ring-2
                focus:ring-[#6230F5]/10

                sm:h-[49px]
                sm:text-[14px]

                md:h-[52px]
                md:text-[15px]
              "
            >


            <!-- SHOW PASSWORD -->

            <button
              id="togglePassword"
              type="button"
              aria-label="Show password"
              class="
                absolute
                right-3
                top-1/2
                flex
                h-9
                w-9
                -translate-y-1/2
                items-center
                justify-center
                rounded-full
                text-[#8FA0B8]
                transition
                hover:bg-[#F3F4F8]
                hover:text-[#6230F5]
                active:scale-95
              "
            >

              <svg
                id="eyeOpen"
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="h-5 w-5"
              >

                <path
                  d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"
                ></path>

                <circle
                  cx="12"
                  cy="12"
                  r="3"
                ></circle>

              </svg>


              <svg
                id="eyeClosed"
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="hidden h-5 w-5"
              >

                <path
                  d="M3 3l18 18"
                ></path>

                <path
                  d="M10.6 10.6a2 2 0 0 0 2.8 2.8"
                ></path>

                <path
                  d="M9.9 5.1A10.8 10.8 0 0 1 12 5c6.5 0 10 7 10 7a17.4 17.4 0 0 1-3 3.8"
                ></path>

                <path
                  d="M6.6 6.6C3.8 8.4 2 12 2 12s3.5 7 10 7c1.6 0 3-.4 4.2-1"
                ></path>

              </svg>

            </button>

          </div>


          <p
            id="passwordError"
            class="
              mt-1
              hidden
              text-[11px]
              font-medium
              text-red-500
            "
          ></p>

        </div>



        <!-- ===============================================
             REMEMBER ME / FORGOT PASSWORD
        ================================================ -->

        <div
          class="
            mt-5
            flex
            items-center
            justify-between
            gap-4
          "
        >


          <!-- REMEMBER ME -->

          <label
            class="
              flex
              cursor-pointer
              items-center
              gap-2
            "
          >

            <input
              id="rememberMe"
              name="rememberMe"
              type="checkbox"
              checked
              class="peer sr-only"
            >


            <span
              class="
                flex
                h-[17px]
                w-[17px]
                shrink-0
                items-center
                justify-center
                rounded-[4px]
                border
                border-[#D7DCE6]
                bg-white
                transition

                peer-checked:border-[#6230F5]
                peer-checked:bg-[#6230F5]

                peer-focus:ring-2
                peer-focus:ring-[#6230F5]/20
              "
            >

              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="none"
                stroke="white"
                stroke-width="3"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="
                  hidden
                  h-3
                  w-3
                  peer-checked:block
                "
              >

                <path
                  d="m5 12 4 4L19 6"
                ></path>

              </svg>

            </span>


            <span
              class="
                text-[11px]
                font-medium
                text-[#3D465A]

                sm:text-[12px]
              "
            >

              Remember me

            </span>

          </label>



          <!-- FORGOT PASSWORD -->

          <a
            href="../06_Forgot Password/index.html"
            class="
              text-[11px]
              font-semibold
              text-[#6230F5]
              transition
              hover:underline

              sm:text-[12px]
            "
          >

            Forgot Password?

          </a>

        </div>



        <!-- ===============================================
             API ERROR
        ================================================ -->

        <div
          id="loginError"
          class="
            mt-4
            hidden
            rounded-[9px]
            border
            border-red-100
            bg-red-50
            px-3
            py-2.5
            text-[11px]
            font-medium
            leading-4
            text-red-600
          "
        ></div>



        <!-- ===============================================
             SIGN IN BUTTON
        ================================================ -->

        <button
          id="signInButton"
          type="submit"
          class="
            mt-7
            flex
            h-[46px]
            w-full
            items-center
            justify-center
            gap-2
            rounded-[13px]
            bg-[#6230F5]
            text-[14px]
            font-semibold
            text-white
            shadow-button
            transition
            hover:bg-[#5424DF]
            active:scale-[0.99]
            disabled:cursor-not-allowed
            disabled:opacity-70

            sm:h-[48px]
            sm:text-[15px]

            md:h-[51px]
          "
        >

          <span id="signInText">
            Sign In
          </span>


          <svg
            id="signInArrow"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="h-5 w-5"
          >

            <path
              d="M5 12h14"
            ></path>

            <path
              d="m12 5 7 7-7 7"
            ></path>

          </svg>


          <svg
            id="loadingSpinner"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            class="hidden h-5 w-5 animate-spin"
          >

            <circle
              cx="12"
              cy="12"
              r="9"
              class="opacity-25"
            ></circle>

            <path
              d="M21 12a9 9 0 0 1-9 9"
            ></path>

          </svg>

        </button>

      </form>



      <!-- =================================================
           SIGN UP
      ================================================== -->

      <div
        class="
          safe-bottom
          mt-auto
          pt-14
          text-center
        "
      >

        <p
          class="
            text-[11px]
            font-normal
            text-[#69738A]

            sm:text-[12px]

            md:text-[13px]
          "
        >

          Don't have an account?

          <a
            href="../02_Create Account/index.html"
            class="
              ml-1
              font-semibold
              text-[#6230F5]
              hover:underline
            "
          >

            Sign Up

          </a>

        </p>


        <!-- HOME INDICATOR -->

        <div
          class="
            mx-auto
            mt-5
            h-[4px]
            w-[115px]
            rounded-full
            bg-[#C9CCD3]

            md:hidden
          "
        ></div>

      </div>

    </section>

  </main>



  <!-- =====================================================
       JAVASCRIPT
  ====================================================== -->

  <script src="./script.js"></script>

</body>

</html>

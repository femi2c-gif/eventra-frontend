<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Eventra - Discover Events</title>


  <!-- =====================================================
       TAILWIND CSS
  ====================================================== -->

  <script src="https://cdn.tailwindcss.com"></script>


  <script>

    tailwind.config = {

      theme: {

        extend: {

          fontFamily: {

            sans: [
              "Arial",
              "Helvetica",
              "sans-serif"
            ]

          },

          colors: {

            eventra: "#6230F5"

          },

          boxShadow: {

            card:
              "0 4px 14px rgba(15, 23, 42, 0.05)",

            nav:
              "0 -3px 15px rgba(15, 23, 42, 0.04)"

          }

        }

      }

    };

  </script>


  <!-- =====================================================
       CUSTOM CSS
  ====================================================== -->

  <style>

    * {
      box-sizing: border-box;
    }


    html {

      min-height: 100%;

      background: #F7F8FC;

    }


    body {

      margin: 0;

      min-width: 320px;

      min-height: 100vh;

      background: #F7F8FC;

      color: #172033;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      font-style: normal !important;

      overflow-x: hidden;

    }


    *,
    *::before,
    *::after {

      font-style: normal !important;

    }


    button,
    input,
    select,
    a {

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      font-style: normal !important;

    }


    button {

      cursor: pointer;

      -webkit-tap-highlight-color:
        transparent;

    }


    input:focus {

      outline: none;

    }


    .safe-bottom {

      padding-bottom:
        env(safe-area-inset-bottom);

    }


    .hide-scrollbar {

      -ms-overflow-style: none;

      scrollbar-width: none;

    }


    .hide-scrollbar::-webkit-scrollbar {

      display: none;

    }


    @media (min-width: 768px) {

      body {

        display: flex;

        justify-content: center;

      }

    }

  </style>

</head>


<body>


  <!-- =====================================================
       MAIN APP
  ====================================================== -->

  <main
    class="
      relative
      min-h-[100svh]
      w-full
      max-w-[480px]
      overflow-hidden
      bg-[#F7F8FC]

      md:max-w-[1100px]

      lg:max-w-[1200px]
    "
  >


    <!-- ===================================================
         TOP HEADER
    ==================================================== -->

    <header
      class="
        sticky
        top-0
        z-30
        border-b
        border-[#E9ECF2]
        bg-[#F7F8FC]/95
        backdrop-blur-md
      "
    >

      <div
        class="
          flex
          h-[57px]
          items-center
          justify-between
          px-4

          sm:px-6

          md:h-[68px]
          md:px-8

          lg:px-10
        "
      >


        <!-- BACK BUTTON -->

        <button
          id="backButton"
          type="button"
          aria-label="Go back"
          class="
            flex
            h-9
            w-9
            items-center
            justify-center
            rounded-full
            text-[#25324A]
            transition
            hover:bg-white
            active:scale-95

            md:h-10
            md:w-10
          "
        >

          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="h-5 w-5"
          >

            <path
              d="M15 18l-6-6 6-6"
            ></path>

          </svg>

        </button>


        <!-- PAGE TITLE -->

        <h1
          class="
            text-[14px]
            font-medium
            text-[#172033]

            sm:text-[15px]

            md:text-[18px]
          "
        >

          Discover Events

        </h1>


        <!-- FILTER BUTTON -->

        <button
          id="filterButton"
          type="button"
          aria-label="Open filters"
          class="
            flex
            h-9
            w-9
            items-center
            justify-center
            rounded-full
            text-[#25324A]
            transition
            hover:bg-white
            active:scale-95

            md:h-10
            md:w-10
          "
        >

          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="h-5 w-5"
          >

            <path
              d="M4 5h16"
            ></path>

            <path
              d="M7 12h10"
            ></path>

            <path
              d="M10 19h4"
            ></path>

          </svg>

        </button>

      </div>

    </header>



    <!-- ===================================================
         CONTENT
    ==================================================== -->

    <section
      class="
        px-4
        pb-[100px]

        sm:px-6

        md:px-8
        md:pb-10

        lg:px-10
      "
    >


      <!-- =================================================
           SEARCH
      ================================================== -->

      <div
        class="
          relative
          mt-4

          md:mt-5
        "
      >

        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="
            pointer-events-none
            absolute
            left-3
            top-1/2
            h-5
            w-5
            -translate-y-1/2
            text-[#91A0B7]
          "
        >

          <circle
            cx="11"
            cy="11"
            r="7"
          ></circle>

          <path
            d="m20 20-4-4"
          ></path>

        </svg>


        <input
          id="searchInput"
          type="search"
          autocomplete="off"
          placeholder="Search events..."
          class="
            h-[38px]
            w-full
            rounded-[10px]
            border
            border-[#DEE4ED]
            bg-[#F7F9FC]
            pl-[38px]
            pr-4
            text-[12px]
            text-[#172033]
            transition

            placeholder:text-[#91A0B7]

            focus:border-[#6230F5]
            focus:bg-white
            focus:ring-2
            focus:ring-[#6230F5]/10

            sm:h-[42px]
            sm:text-[13px]

            md:h-[48px]
            md:rounded-[12px]
            md:text-[14px]
          "
        >

      </div>



      <!-- =================================================
           FILTER CHIPS
      ================================================== -->

      <div
        class="
          hide-scrollbar
          mt-3
          flex
          gap-2
          overflow-x-auto
          pb-1
        "
      >


        <!-- LOCATION -->

        <button
          id="locationFilter"
          type="button"
          class="
            flex
            h-[28px]
            shrink-0
            items-center
            gap-1.5
            rounded-full
            border
            border-[#E1D9FF]
            bg-[#F4F0FF]
            px-3
            text-[10px]
            font-semibold
            text-[#6230F5]
            transition
            hover:bg-[#ECE5FF]
            active:scale-95

            sm:h-[30px]
            sm:text-[11px]

            md:h-[34px]
            md:px-4
            md:text-[12px]
          "
        >

          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="currentColor"
            class="h-3.5 w-3.5"
          >

            <path
              d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7Zm0 9.5A2.5 2.5 0 1 1 12 6a2.5 2.5 0 0 1 0 5.5Z"
            ></path>

          </svg>

          Lagos

          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="h-3 w-3"
          >

            <path
              d="m6 9 6 6 6-6"
            ></path>

          </svg>

        </button>



        <!-- DATE -->

        <button
          id="dateFilter"
          type="button"
          class="
            flex
            h-[28px]
            shrink-0
            items-center
            gap-1.5
            rounded-full
            border
            border-[#DDE3EC]
            bg-[#F8FAFD]
            px-3
            text-[10px]
            font-medium
            text-[#40506A]
            transition
            hover:bg-white
            active:scale-95

            sm:h-[30px]
            sm:text-[11px]

            md:h-[34px]
            md:px-4
            md:text-[12px]
          "
        >

          Date

          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="h-3 w-3"
          >

            <path
              d="m6 9 6 6 6-6"
            ></path>

          </svg>

        </button>



        <!-- CATEGORY -->

        <button
          id="categoryFilter"
          type="button"
          class="
            flex
            h-[28px]
            shrink-0
            items-center
            gap-1.5
            rounded-full
            border
            border-[#DDE3EC]
            bg-[#F8FAFD]
            px-3
            text-[10px]
            font-medium
            text-[#40506A]
            transition
            hover:bg-white
            active:scale-95

            sm:h-[30px]
            sm:text-[11px]

            md:h-[34px]
            md:px-4
            md:text-[12px]
          "
        >

          Category

          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="h-3 w-3"
          >

            <path
              d="m6 9 6 6 6-6"
            ></path>

          </svg>

        </button>

      </div>



      <!-- =================================================
           RESULT HEADER
      ================================================== -->

      <div
        class="
          mt-4
          flex
          items-center
          justify-between
          border-t
          border-[#EAEDF3]
          pt-3

          md:mt-6
          md:pt-4
        "
      >

        <p
          id="resultCount"
          class="
            text-[10px]
            font-semibold
            text-[#40506A]

            sm:text-[11px]

            md:text-[13px]
          "
        >

          120 events found

        </p>


        <button
          id="sortButton"
          type="button"
          class="
            flex
            items-center
            gap-1
            text-[10px]
            font-medium
            text-[#59667D]
            transition
            hover:text-[#6230F5]

            sm:text-[11px]

            md:text-[13px]
          "
        >

          Sort

          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="h-3.5 w-3.5"
          >

            <path
              d="m6 9 6 6 6-6"
            ></path>

          </svg>

        </button>

      </div>



      <!-- =================================================
           EVENTS LIST
      ================================================== -->

      <div
        id="eventsContainer"
        class="
          mt-3
          grid
          grid-cols-1
          gap-3

          md:grid-cols-2
          md:gap-5

          lg:grid-cols-3
        "
      ></div>



      <!-- =================================================
           EMPTY STATE
      ================================================== -->

      <div
        id="emptyState"
        class="
          hidden
          flex
          flex-col
          items-center
          justify-center
          px-6
          py-16
          text-center
        "
      >

        <div
          class="
            flex
            h-14
            w-14
            items-center
            justify-center
            rounded-full
            bg-[#EEE9FF]
          "
        >

          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="#6230F5"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="h-6 w-6"
          >

            <circle
              cx="11"
              cy="11"
              r="7"
            ></circle>

            <path
              d="m20 20-4-4"
            ></path>

          </svg>

        </div>


        <h2
          class="
            mt-4
            text-[16px]
            font-bold
            text-[#172033]
          "
        >

          No events found

        </h2>


        <p
          class="
            mt-1
            max-w-[280px]
            text-[12px]
            leading-5
            text-[#69738A]
          "
        >

          Try changing your search or filters to find
          more events.

        </p>

      </div>

    </section>



    <!-- ===================================================
         BOTTOM NAVIGATION
    ==================================================== -->

    <nav
      class="
        fixed
        bottom-0
        left-1/2
        z-40
        w-full
        max-w-[480px]
        -translate-x-1/2
        border-t
        border-[#E7EAF0]
        bg-white
        shadow-nav

        md:absolute
        md:bottom-0
        md:max-w-[1100px]

        lg:max-w-[1200px]
      "
    >

      <div
        class="
          safe-bottom
          grid
          grid-cols-5
          px-2
          pt-2

          md:mx-auto
          md:max-w-[700px]
        "
      >


        <!-- HOME -->

        <button
          id="homeNav"
          type="button"
          class="
            flex
            flex-col
            items-center
            gap-1
            py-1
            text-[#91A0B7]
            transition
            hover:text-[#6230F5]
          "
        >

          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="h-5 w-5"
          >

            <path
              d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"
            ></path>

            <path
              d="M9 21v-7h6v7"
            ></path>

          </svg>


          <span
            class="text-[10px] font-medium"
          >

            Home

          </span>

        </button>



        <!-- DISCOVER -->

        <button
          id="discoverNav"
          type="button"
          class="
            flex
            flex-col
            items-center
            gap-1
            py-1
            text-[#6230F5]
          "
        >

          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="h-5 w-5"
          >

            <circle
              cx="11"
              cy="11"
              r="7"
            ></circle>

            <path
              d="m20 20-4-4"
            ></path>

          </svg>


          <span
            class="text-[10px] font-semibold"
          >

            Discover

          </span>

        </button>



        <!-- TICKETS -->

        <button
          id="ticketsNav"
          type="button"
          class="
            flex
            flex-col
            items-center
            gap-1
            py-1
            text-[#91A0B7]
            transition
            hover:text-[#6230F5]
          "
        >

          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="h-5 w-5"
          >

            <path
              d="M4 5h16v14H4z"
            ></path>

            <path
              d="M8 5v3"
            ></path>

            <path
              d="M16 16v3"
            ></path>

            <path
              d="M8 12h.01"
            ></path>

            <path
              d="M16 12h.01"
            ></path>

          </svg>


          <span
            class="text-[10px] font-medium"
          >

            Tickets

          </span>

        </button>



        <!-- NOTIFICATIONS -->

        <button
          id="notificationsNav"
          type="button"
          class="
            flex
            flex-col
            items-center
            gap-1
            py-1
            text-[#91A0B7]
            transition
            hover:text-[#6230F5]
          "
        >

          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="h-5 w-5"
          >

            <path
              d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"
            ></path>

            <path
              d="M10 21h4"
            ></path>

          </svg>


          <span
            class="text-[10px] font-medium"
          >

            Notifications

          </span>

        </button>



        <!-- PROFILE -->

        <button
          id="profileNav"
          type="button"
          class="
            flex
            flex-col
            items-center
            gap-1
            py-1
            text-[#91A0B7]
            transition
            hover:text-[#6230F5]
          "
        >

          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="h-5 w-5"
          >

            <circle
              cx="12"
              cy="8"
              r="4"
            ></circle>

            <path
              d="M4 21a8 8 0 0 1 16 0"
            ></path>

          </svg>


          <span
            class="text-[10px] font-medium"
          >

            Profile

          </span>

        </button>

      </div>

    </nav>



    <!-- ===================================================
         FILTER MODAL
    ==================================================== -->

    <div
      id="filterModal"
      class="
        fixed
        inset-0
        z-50
        hidden
        items-end
        justify-center
        bg-black/30
        px-3
        pb-3

        md:items-center
      "
    >

      <div
        class="
          w-full
          max-w-[430px]
          rounded-[18px]
          bg-white
          p-5
          shadow-2xl

          md:max-w-[500px]
        "
      >

        <div
          class="
            flex
            items-center
            justify-between
          "
        >

          <h2
            class="
              text-[17px]
              font-bold
              text-[#172033]
            "
          >

            Filters

          </h2>


          <button
            id="closeFilter"
            type="button"
            class="
              flex
              h-8
              w-8
              items-center
              justify-center
              rounded-full
              bg-[#F4F5F8]
              text-[#596174]
            "
          >

            ×

          </button>

        </div>


        <div class="mt-5">

          <p
            class="
              text-[11px]
              font-bold
              uppercase
              text-[#596174]
            "
          >

            Category

          </p>


          <div
            id="categoryOptions"
            class="
              mt-3
              flex
              flex-wrap
              gap-2
            "
          >

            <button
              type="button"
              data-category="All"
              class="
                category-option
                rounded-full
                bg-[#6230F5]
                px-4
                py-2
                text-[11px]
                font-semibold
                text-white
              "
            >

              All

            </button>


            <button
              type="button"
              data-category="Music"
              class="
                category-option
                rounded-full
                bg-[#F3F4F8]
                px-4
                py-2
                text-[11px]
                font-medium
                text-[#40506A]
              "
            >

              Music

            </button>


            <button
              type="button"
              data-category="Food"
              class="
                category-option
                rounded-full
                bg-[#F3F4F8]
                px-4
                py-2
                text-[11px]
                font-medium
                text-[#40506A]
              "
            >

              Food

            </button>


            <button
              type="button"
              data-category="Comedy"
              class="
                category-option
                rounded-full
                bg-[#F3F4F8]
                px-4
                py-2
                text-[11px]
                font-medium
                text-[#40506A]
              "
            >

              Comedy

            </button>


            <button
              type="button"
              data-category="Arts"
              class="
                category-option
                rounded-full
                bg-[#F3F4F8]
                px-4
                py-2
                text-[11px]
                font-medium
                text-[#40506A]
              "
            >

              Arts

            </button>

          </div>

        </div>


        <button
          id="applyFilter"
          type="button"
          class="
            mt-6
            h-[46px]
            w-full
            rounded-[11px]
            bg-[#6230F5]
            text-[13px]
            font-semibold
            text-white
            shadow-lg
            shadow-[#6230F5]/20
          "
        >

          Apply Filters

        </button>

      </div>

    </div>


  </main>


  <!-- =====================================================
       JAVASCRIPT
  ====================================================== -->

  <script src="./script.js"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Eventra | Create Account</title>

  <!-- =========================================================
       TAILWIND CSS
       ========================================================= -->

  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: [
              "Arial",
              "Helvetica",
              "sans-serif"
            ],
          },

          colors: {
            eventra: {
              purple: "#6230F5",
              dark: "#171C2B",
              muted: "#9298A8",
              border: "#E3E7EE",
            },
          },
        },
      },
    };
  </script>


  <!-- =========================================================
       FORCE NORMAL TYPOGRAPHY
       ========================================================= -->

  <style>
    html,
    body,
    body *,
    button,
    input,
    label,
    p,
    h1,
    span {
      font-style: normal !important;
    }

    button,
    input {
      font-family: Arial, Helvetica, sans-serif !important;
    }

    input::placeholder {
      font-style: normal !important;
    }
  </style>

</head>


<body
  class="
    m-0
    min-h-screen
    overflow-x-hidden
    bg-white
    font-sans
    font-normal
    text-[#171C2B]
  "
>


  <!-- =========================================================
       SCREEN 02
       CREATE ACCOUNT
       ========================================================= -->

  <main
    class="
      min-h-[100svh]
      w-full
      bg-white
    "
  >

    <!-- =======================================================
         MAIN CONTAINER
         ======================================================= -->

    <div
      class="
        mx-auto
        flex
        min-h-[100svh]
        w-full
        max-w-[520px]
        flex-col
        px-[22px]
        pb-6
        pt-5

        sm:px-8
        sm:pt-7

        md:max-w-[620px]
        md:px-10

        lg:max-w-[700px]
        lg:px-12
        lg:pt-10
      "
    >


      <!-- =====================================================
           BACK BUTTON
           ===================================================== -->

      <div class="flex items-center">

        <button
          id="backBtn"
          type="button"
          aria-label="Go back"
          class="
            flex
            h-9
            w-9
            items-center
            justify-start
            rounded-full
            bg-transparent
            text-[#171C2B]
            transition
            duration-200
            hover:bg-gray-100
            active:scale-95
            focus:outline-none
          "
        >

          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="h-[22px] w-[22px]"
            aria-hidden="true"
          >
            <path d="M15 18l-6-6 6-6"></path>
          </svg>

        </button>

      </div>


      <!-- =====================================================
           HEADER
           ===================================================== -->

      <header
        class="
          mt-3

          sm:mt-4

          md:mt-5
        "
      >

        <h1
          class="
            font-sans
            text-[22px]
            font-semibold
            leading-[28px]
            tracking-[-0.4px]
            text-[#171C2B]

            sm:text-[23px]
            sm:leading-8

            md:text-[26px]
            md:leading-9
          "
        >
          Create Account
        </h1>


        <p
          class="
            mt-1
            font-sans
            text-[13px]
            font-normal
            leading-[19px]
            text-[#9298A8]

            sm:text-[14px]
            sm:leading-5

            md:text-[15px]
          "
        >
          Join Eventra and start exploring amazing events.
        </p>

      </header>


      <!-- =====================================================
           FORM
           ===================================================== -->

      <form
        id="registerForm"
        class="
          mt-7
          flex
          flex-1
          flex-col

          sm:mt-8

          md:mt-9
        "
        novalidate
      >


        <!-- ===================================================
             FIRST NAME + LAST NAME
             =================================================== -->

        <div
          class="
            grid
            grid-cols-2
            gap-[10px]

            sm:gap-4
          "
        >


          <!-- FIRST NAME -->

          <div>

            <label
              for="firstName"
              class="
                mb-2
                block
                font-sans
                text-[12px]
                font-semibold
                leading-4
                text-[#353C4C]

                sm:text-[13px]
              "
            >
              First Name
            </label>


            <input
              id="firstName"
              name="first_name"
              type="text"
              autocomplete="given-name"
              placeholder="John"
              class="
                h-[42px]
                w-full
                rounded-[10px]
                border
                border-[#E3E7EE]
                bg-[#FCFCFD]
                px-[14px]
                font-sans
                text-[14px]
                font-normal
                text-[#171C2B]
                outline-none
                transition
                duration-200
                placeholder:text-[#171C2B]/80
                focus:border-[#6230F5]
                focus:ring-2
                focus:ring-[#6230F5]/10

                sm:h-[45px]
                sm:text-[14px]

                md:h-[49px]
                md:text-[15px]
              "
              required
            >

          </div>


          <!-- LAST NAME -->

          <div>

            <label
              for="lastName"
              class="
                mb-2
                block
                font-sans
                text-[12px]
                font-semibold
                leading-4
                text-[#353C4C]

                sm:text-[13px]
              "
            >
              Last Name
            </label>


            <input
              id="lastName"
              name="last_name"
              type="text"
              autocomplete="family-name"
              placeholder="Doe"
              class="
                h-[42px]
                w-full
                rounded-[10px]
                border
                border-[#E3E7EE]
                bg-[#FCFCFD]
                px-[14px]
                font-sans
                text-[14px]
                font-normal
                text-[#171C2B]
                outline-none
                transition
                duration-200
                placeholder:text-[#171C2B]/80
                focus:border-[#6230F5]
                focus:ring-2
                focus:ring-[#6230F5]/10

                sm:h-[45px]
                sm:text-[14px]

                md:h-[49px]
                md:text-[15px]
              "
              required
            >

          </div>

        </div>


        <!-- ===================================================
             EMAIL
             =================================================== -->

        <div class="mt-6">

          <label
            for="email"
            class="
              mb-2
              block
              font-sans
              text-[12px]
              font-semibold
              leading-4
              text-[#353C4C]

              sm:text-[13px]
            "
          >
            Email
          </label>


          <input
            id="email"
            name="email"
            type="email"
            autocomplete="email"
            placeholder="john@example.com"
            class="
              h-[42px]
              w-full
              rounded-[10px]
              border
              border-[#E3E7EE]
              bg-[#FCFCFD]
              px-[14px]
              font-sans
              text-[14px]
              font-normal
              text-[#171C2B]
              outline-none
              transition
              duration-200
              placeholder:text-[#171C2B]/80
              focus:border-[#6230F5]
              focus:ring-2
              focus:ring-[#6230F5]/10

              sm:h-[45px]
              sm:text-[14px]

              md:h-[49px]
              md:text-[15px]
            "
            required
          >

        </div>


        <!-- ===================================================
             PASSWORD
             =================================================== -->

        <div class="mt-6">

          <label
            for="password"
            class="
              mb-2
              block
              font-sans
              text-[12px]
              font-semibold
              leading-4
              text-[#353C4C]

              sm:text-[13px]
            "
          >
            Password
          </label>


          <input
            id="password"
            name="password"
            type="password"
            autocomplete="new-password"
            placeholder="secretpassword"
            minlength="8"
            class="
              h-[42px]
              w-full
              rounded-[10px]
              border
              border-[#E3E7EE]
              bg-[#FCFCFD]
              px-[14px]
              font-sans
              text-[14px]
              font-normal
              tracking-[0.4px]
              text-[#171C2B]
              outline-none
              transition
              duration-200
              placeholder:font-sans
              placeholder:text-[#171C2B]/80
              focus:border-[#6230F5]
              focus:ring-2
              focus:ring-[#6230F5]/10

              sm:h-[45px]
              sm:text-[14px]

              md:h-[49px]
              md:text-[15px]
            "
            required
          >

        </div>


        <!-- ===================================================
             TERMS AND CONDITIONS
             =================================================== -->

        <label
          for="terms"
          class="
            mt-7
            flex
            cursor-pointer
            items-center
            select-none
          "
        >

          <!-- REAL CHECKBOX -->

          <input
            id="terms"
            name="terms"
            type="checkbox"
            class="
              h-[18px]
              w-[18px]
              shrink-0
              cursor-pointer
              appearance-none
              rounded-[4px]
              border
              border-[#D5D8E0]
              bg-white
              transition
              duration-150

              checked:border-[#6230F5]
              checked:bg-[#6230F5]

              focus:outline-none
              focus:ring-2
              focus:ring-[#6230F5]/20
            "
            required
          >


          <!-- CHECKMARK -->

          <span
            id="checkmark"
            class="
              pointer-events-none
              absolute
              ml-[3px]
              hidden
              text-white
            "
          >

            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="3"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="h-[12px] w-[12px]"
            >
              <path d="M5 12l4 4L19 8"></path>
            </svg>

          </span>


          <!-- TERMS TEXT -->

          <span
            class="
              ml-2
              font-sans
              text-[11px]
              font-normal
              leading-4
              text-[#303643]

              sm:text-[12px]
            "
          >
            I agree to the

            <button
              id="termsBtn"
              type="button"
              class="
                font-sans
                text-[11px]
                font-normal
                text-[#6230F5]
                hover:underline

                sm:text-[12px]
              "
            >
              Terms &amp; Conditions
            </button>

          </span>

        </label>


        <!-- ===================================================
             ERROR MESSAGE
             =================================================== -->

        <div
          id="errorMessage"
          class="
            mt-3
            hidden
            rounded-lg
            bg-red-50
            px-3
            py-2
            font-sans
            text-[12px]
            font-medium
            leading-4
            text-red-600
          "
          role="alert"
        ></div>


        <!-- ===================================================
             CREATE ACCOUNT
             =================================================== -->

        <button
          id="createAccountBtn"
          type="submit"
          class="
            mt-7
            flex
            h-[44px]
            w-full
            items-center
            justify-center
            rounded-[10px]
            bg-[#6230F5]
            px-5
            font-sans
            text-[13px]
            font-semibold
            text-white
            shadow-[0_8px_20px_rgba(98,48,245,0.20)]
            transition-all
            duration-200
            hover:bg-[#5625E0]
            hover:shadow-[0_10px_24px_rgba(98,48,245,0.28)]
            active:scale-[0.99]
            disabled:cursor-not-allowed
            disabled:opacity-60
            focus:outline-none
            focus:ring-2
            focus:ring-[#6230F5]/30

            sm:h-[47px]
            sm:text-[14px]

            md:h-[51px]
            md:text-[15px]
          "
        >

          <span id="buttonText">
            Create Account
          </span>


          <span
            id="buttonLoader"
            class="ml-2 hidden"
          >

            <svg
              class="h-4 w-4 animate-spin"
              viewBox="0 0 24 24"
              fill="none"
              aria-hidden="true"
            >

              <circle
                class="opacity-25"
                cx="12"
                cy="12"
                r="10"
                stroke="currentColor"
                stroke-width="4"
              ></circle>

              <path
                class="opacity-75"
                fill="currentColor"
                d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"
              ></path>

            </svg>

          </span>

        </button>


        <!-- ===================================================
             FLEXIBLE SPACE
             =================================================== -->

        <div class="flex-1"></div>


        <!-- ===================================================
             SIGN IN
             =================================================== -->

        <div
          class="
            mt-12
            text-center

            sm:mt-14

            md:mt-16
          "
        >

          <p
            class="
              font-sans
              text-[11px]
              font-normal
              leading-5
              text-[#9298A8]

              sm:text-[12px]

              md:text-[13px]
            "
          >

            Already have an account?

            <button
              id="signInLink"
              type="button"
              class="
                font-sans
                text-[11px]
                font-semibold
                text-[#6230F5]
                hover:underline

                sm:text-[12px]

                md:text-[13px]
              "
            >
              Sign In
            </button>

          </p>

        </div>


        <!-- ===================================================
             MOBILE HOME INDICATOR
             =================================================== -->

        <div
          class="
            mx-auto
            mt-4
            h-[4px]
            w-[114px]
            rounded-full
            bg-[#C9CBD0]

            md:hidden
          "
          aria-hidden="true"
        ></div>


      </form>

    </div>

  </main>


  <!-- =========================================================
       JAVASCRIPT
       ========================================================= -->

  <script src="./script.js"></script>

</body>

</html>
